name: Expanded Anthropic validation and saved-code checks

on:
  workflow_dispatch:
    inputs:
      evaluate_saved_programs:
        description: Test the 16 saved outputs from run 39458106201; no model calls or model keys
        required: true
        default: false
        type: boolean
      confirm_paid_generation:
        description: Generate only the 16 excluded Sonnet 5.5 validation programs, within the reviewed $6 limit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: depfailbench-expanded-anthropic-validation
  cancel-in-progress: false

jobs:
  validation:
    if: ${{ inputs.confirm_paid_generation && !inputs.evaluate_saved_programs && github.run_attempt == '1' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install the exact reviewed dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Verify batch guards and rehearse all sixteen slots without credentials
        run: |
          python -m pytest -q tests/test_expanded_anthropic_batch.py --junitxml=results/expanded/anthropic_batch_tests.junit.xml
          python scripts/expanded_anthropic_validation.py mock-rehearsal --state results/expanded/anthropic_batch_mock
      - name: Prepare the scoped validation permission and spending ledger
        env:
          CONFIRM_PAID_GENERATION: "true"
        run: python scripts/expanded_anthropic_validation.py prepare --state results/expanded/anthropic_api_validation --maximum-cost-usd 6
      - name: Preserve the complete plan before any authenticated provider request
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-prepared
          path: results/expanded/anthropic_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Check model metadata without generating a response
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/expanded_anthropic_validation.py access --state results/expanded/anthropic_api_validation
      - name: Generate validation pair 0
        id: pair0
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/expanded_anthropic_validation.py pair --state results/expanded/anthropic_api_validation --index 0
      - name: Preserve response journals and spending after pair 0
        if: ${{ always() && steps.pair0.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-pair-0
          path: results/expanded/anthropic_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Generate validation pair 1
        id: pair1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/expanded_anthropic_validation.py pair --state results/expanded/anthropic_api_validation --index 1
      - name: Preserve response journals and spending after pair 1
        if: ${{ always() && steps.pair1.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-pair-1
          path: results/expanded/anthropic_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Generate validation pair 2
        id: pair2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/expanded_anthropic_validation.py pair --state results/expanded/anthropic_api_validation --index 2
      - name: Preserve response journals and spending after pair 2
        if: ${{ always() && steps.pair2.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-pair-2
          path: results/expanded/anthropic_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Generate validation pair 3
        id: pair3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/expanded_anthropic_validation.py pair --state results/expanded/anthropic_api_validation --index 3
      - name: Preserve response journals and spending after pair 3
        if: ${{ always() && steps.pair3.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-pair-3
          path: results/expanded/anthropic_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Generate validation pair 4
        id: pair4
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/expanded_anthropic_validation.py pair --state results/expanded/anthropic_api_validation --index 4
      - name: Preserve response journals and spending after pair 4
        if: ${{ always() && steps.pair4.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-pair-4
          path: results/expanded/anthropic_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Generate validation pair 5
        id: pair5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/expanded_anthropic_validation.py pair --state results/expanded/anthropic_api_validation --index 5
      - name: Preserve response journals and spending after pair 5
        if: ${{ always() && steps.pair5.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-pair-5
          path: results/expanded/anthropic_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Generate validation pair 6
        id: pair6
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/expanded_anthropic_validation.py pair --state results/expanded/anthropic_api_validation --index 6
      - name: Preserve response journals and spending after pair 6
        if: ${{ always() && steps.pair6.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-pair-6
          path: results/expanded/anthropic_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Generate validation pair 7
        id: pair7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/expanded_anthropic_validation.py pair --state results/expanded/anthropic_api_validation --index 7
      - name: Preserve response journals and spending after pair 7
        if: ${{ always() && steps.pair7.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-pair-7
          path: results/expanded/anthropic_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Verify every declared output and write the validation-only usage summary
        run: python scripts/expanded_anthropic_validation.py summarize --state results/expanded/anthropic_api_validation
      - name: Preserve final evidence even after an account or generation failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-validation-${{ github.run_id }}-final
          path: results/expanded/
          if-no-files-found: error
          retention-days: 90
  saved-code-evaluation:
    if: ${{ inputs.evaluate_saved_programs && !inputs.confirm_paid_generation }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install the same exact dependencies used for the validated harness
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Test archive and evaluation guards without running model-generated programs
        run: python -m pytest -q tests/test_expanded_saved_validation.py
      - name: Download the exact completed generation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/agrawal-priyank/depfailbench/actions/artifacts/12281573442/zip > "$RUNNER_TEMP/anthropic_validation_final.zip"
      - name: Verify and preserve the original sources before evaluation
        run: python scripts/evaluate_saved_anthropic_validation.py prepare --archive "$RUNNER_TEMP/anthropic_validation_final.zip" --output results/expanded/anthropic_saved_evaluation
      - name: Preserve verified inputs before executing saved programs
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-saved-evaluation-${{ github.run_id }}-inputs
          path: results/expanded/anthropic_saved_evaluation/
          if-no-files-found: error
          retention-days: 90
      - name: Evaluate all saved programs at the fixed deadlines and repeats without model credentials
        run: python scripts/evaluate_saved_anthropic_validation.py evaluate --output results/expanded/anthropic_saved_evaluation
      - name: Preserve all completed records even if evaluation is interrupted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-saved-evaluation-${{ github.run_id }}-final
          path: results/expanded/anthropic_saved_evaluation/
          if-no-files-found: error
          retention-days: 90
