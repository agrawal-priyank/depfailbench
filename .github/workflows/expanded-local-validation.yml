name: Array main scoped recovery
run-name: Array main recovery round ${{ inputs.round_id }} (${{ inputs.mode }})
on:
  workflow_dispatch:
    inputs:
      mode: {description: 'Software gate or authorized paid continuation', type: choice, options: [software, paid], default: software, required: true}
      round_id: {description: 'Fixed coverage round2 through6', type: choice, options: ['3', '4', '5', '6'], default: '3', required: true}
      previous_run: {description: 'Prior completed round run, zero for initial round', type: string, default: '0', required: true}
      verified_software_run: {description: 'Successful exact-commit software-only run', type: string, default: '0', required: true}
permissions: {contents: read, actions: read}
concurrency:
  group: array-main-recovery-20261022
  cancel-in-progress: false
env:
  REMAINING_ROUND: ${{ inputs.round_id }}
  REMAINING_MODE: ${{ inputs.mode }}
  PREVIOUS_ROUND_RUN: ${{ inputs.previous_run }}
  VERIFIED_SOFTWARE_RUN: ${{ inputs.verified_software_run }}
  PYTHONUNBUFFERED: '1'
jobs:
  software:
    if: ${{ github.run_attempt == '1' && github.ref == 'refs/heads/array-main-recovery-20261022' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14', cache: pip}
      - name: Install frozen dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Validate fixed design, spending controls and corrected evaluator
        run: |
          python -m pytest -q tests/test_expanded_state_capture.py tests/test_round1_state_capture_review.py tests/test_expanded_study.py tests/test_repeat_audit.py tests/test_expanded_status_policy.py tests/test_expanded_providers.py tests/test_expanded_live_recovery.py tests/test_main_remaining.py tests/test_main_recovery.py --junitxml=results/software/software.xml
          python scripts/continue_main_remaining.py check
          python scripts/control_main_remaining.py software-report --output results/software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-main-software-${{ github.run_id }}
          path: results/software/
          if-no-files-found: error
          retention-days: 90
  entry:
    needs: software
    if: ${{ inputs.mode == 'paid' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14', cache: pip}
      - name: Install frozen dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Verify exact software gate and prior coverage completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/control_main_remaining.py entry --output results/entry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-main-entry-${{ github.run_id }}
          path: results/entry/
          if-no-files-found: error
          retention-days: 90
  w0-generation:
    needs: entry
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {include: [{"provider": "Anthropic", "slug": "anthropic", "secret_name": "ANTHROPIC_API_KEY"}, {"provider": "OpenAI", "slug": "openai", "secret_name": "OPENAI_API_KEY"}, {"provider": "Google", "slug": "google", "secret_name": "GEMINI_API_KEY"}, {"provider": "Mistral", "slug": "mistral", "secret_name": "MISTRAL_API_KEY"}]}
    env:
      CONFIRM_REMAINING_MAIN: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14', cache: pip}
      - name: Install frozen dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Verify prior audited sources and copy charged ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/continue_main_remaining.py prepare --provider ${{ matrix.provider }} --wave 0 --state results/generation/${{ matrix.slug }}
      - name: Preserve stable round guard before providing any model key
        uses: actions/upload-artifact@v4
        with:
          name: main-clarified-prompts-20261021-fresh-v1-recovery-r${{ inputs.round_id }}-prepared-${{ matrix.slug }}
          path: results/generation/${{ matrix.slug }}/wave_manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Generate fixed batch with at most two inflight calls
        env:
          REMAINING_PROVIDER_API_KEY: ${{ secrets[matrix.secret_name] }}
        run: python scripts/continue_main_remaining.py generate --provider ${{ matrix.provider }} --wave 0 --state results/generation/${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-main-remaining-generation-${{ github.run_id }}-r${{ inputs.round_id }}-w0-${{ matrix.slug }}-final
          path: results/generation/
          if-no-files-found: error
          retention-days: 90
  w0-evaluation:
    needs: w0-generation
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: [{"provider": "Anthropic", "slug": "anthropic", "shard": 0}, {"provider": "Anthropic", "slug": "anthropic", "shard": 1}, {"provider": "Anthropic", "slug": "anthropic", "shard": 2}, {"provider": "Anthropic", "slug": "anthropic", "shard": 3}, {"provider": "OpenAI", "slug": "openai", "shard": 0}, {"provider": "OpenAI", "slug": "openai", "shard": 1}, {"provider": "OpenAI", "slug": "openai", "shard": 2}, {"provider": "OpenAI", "slug": "openai", "shard": 3}, {"provider": "Google", "slug": "google", "shard": 0}, {"provider": "Google", "slug": "google", "shard": 1}, {"provider": "Google", "slug": "google", "shard": 2}, {"provider": "Google", "slug": "google", "shard": 3}, {"provider": "Mistral", "slug": "mistral", "shard": 0}, {"provider": "Mistral", "slug": "mistral", "shard": 1}, {"provider": "Mistral", "slug": "mistral", "shard": 2}, {"provider": "Mistral", "slug": "mistral", "shard": 3}]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14', cache: pip}
      - name: Install frozen dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Fetch and verify generation without executing sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/evaluate_main_remaining.py prepare --provider ${{ matrix.provider }} --wave 0 --shard ${{ matrix.shard }} --output results/evaluation
      - name: Measure saved sources without credentials, one measurement at a time
        run: python scripts/evaluate_main_remaining.py evaluate --provider ${{ matrix.provider }} --wave 0 --shard ${{ matrix.shard }} --output results/evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-main-remaining-evaluation-${{ github.run_id }}-r${{ inputs.round_id }}-w0-${{ matrix.slug }}-s${{ matrix.shard }}-final
          path: results/evaluation/
          if-no-files-found: error
          retention-days: 90
  w0-audit:
    needs: w0-evaluation
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {include: [{"provider": "Anthropic", "slug": "anthropic"}, {"provider": "OpenAI", "slug": "openai"}, {"provider": "Google", "slug": "google"}, {"provider": "Mistral", "slug": "mistral"}]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14', cache: pip}
      - name: Install frozen dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Replay saved streams, charges and all raw evaluation observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/evaluate_main_remaining.py audit --provider ${{ matrix.provider }} --wave 0 --output results/audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-main-remaining-audit-${{ github.run_id }}-r${{ inputs.round_id }}-w0-${{ matrix.slug }}-final
          path: results/audit/
          if-no-files-found: error
