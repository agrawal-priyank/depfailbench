name: Array first-round continuation and software checks

on:
  workflow_dispatch:
    inputs:
      round1_continuation:
        description: 'Approved bounded continuation from40to720 main outputs'
        type: boolean
        default: false
      confirm_paid:
        description: 'Generate only the680 remaining first-round outputs after verified software gate'
        type: boolean
        default: false
      verified_software_run:
        description: 'Successful offline Linux gate run at this exact commit'
        type: string
        default: ''
  push:
    branches: [array-revision-linux-validation]

permissions:
  contents: read
  actions: read

concurrency:
  group: depfailbench-expanded-local-validation
  cancel-in-progress: false

jobs:
  local-validation:
    if: ${{ !inputs.round1_continuation }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install exact runtime and analysis dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Run tests and inspect the unexecuted allocation
        run: |
          python -m pytest -q --junitxml=results/expanded/linux_tests.junit.xml
          python -m benchmark.expanded preflight --output results/expanded/plan_preview
      - name: Record the Linux runtime and measured implementation
        run: |
          python - <<'PY'
          import json, os, platform, sys
          from pathlib import Path
          from benchmark.expanded.collect import environment, implementation_manifest
          assert sys.platform == "linux" and platform.machine() == "x86_64"
          report = {"environment": environment(), "implementation": implementation_manifest(),
                    "github_commit": os.environ["GITHUB_SHA"], "github_run_id": os.environ["GITHUB_RUN_ID"],
                    "model_api_calls": 0, "validation_kind": "reference_and_synthetic_only"}
          Path("results/expanded/linux_platform.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Collect saved reference and negative controls at every deadline and repeat
        run: |
          python -m benchmark.expanded.collection_dry_run --mode reference-controls \
            --output results/expanded/collection_controls
          python -m benchmark.expanded.report_collection \
            results/expanded/collection_controls/collection \
            --output results/expanded/collection_control_exports
      - name: Rehearse full three-deadline reporting with synthetic records
        run: |
          python -m benchmark.expanded.collection_dry_run --mode synthetic-reporting \
            --output results/expanded/collection_synthetic_reporting
      - name: Exercise reporting with explicitly synthetic records
        run: |
          python expanded_study/analysis.py --synthetic-demo \
            --output results/expanded/synthetic_analysis/summary.json
      - name: Rehearse provider requests with synthetic HTTP responses only
        run: |
          python -m benchmark.expanded.provider_dry_run \
            --output results/expanded/provider_rehearsal
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-local-validation-${{ github.run_number }}
          path: results/expanded/
          if-no-files-found: error
          retention-days: 90
  round1-software-gate:
    if: ${{ inputs.round1_continuation && github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref == 'refs/heads/array-revision-linux-validation' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install exact reviewed runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Validate exact frozen scientific assets and bounded continuation
        run: python scripts/continue_main_round1.py check
      - name: Run offline software controls only
        if: ${{ !inputs.confirm_paid }}
        run: |
          python -m pytest -q tests/test_staged_main_first_gate.py tests/test_amended_main_preparation.py tests/test_expanded_study.py tests/test_main_round1_continuation.py --junitxml=results/software/tests.junit.xml
          python scripts/record_evaluation_host.py --output results/software/host_metadata.json
          python scripts/round1_software_gate.py record --output results/software
      - name: Verify previously audited software gate before any model key is available
        if: ${{ inputs.confirm_paid }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SOFTWARE_RUN: ${{ inputs.verified_software_run }}
        run: python scripts/round1_software_gate.py verify --run-id "$VERIFIED_SOFTWARE_RUN" --output results/verified_software
      - name: Preserve offline software or verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-main-round1-software-${{ github.run_id }}
          path: ${{ inputs.confirm_paid && 'results/verified_software/' || 'results/software/' }}
          if-no-files-found: error
          retention-days: 90
  round1-w0-generation:
    name: round1-w0-generation-${{ matrix.provider }}
    needs: ["round1-software-gate"]
    if: ${{ inputs.round1_continuation && inputs.confirm_paid && github.run_attempt == '1' && github.ref == 'refs/heads/array-revision-linux-validation' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {"include":[{"provider":"Anthropic","slug":"anthropic","secret_name":"ANTHROPIC_API_KEY"},{"provider":"OpenAI","slug":"openai","secret_name":"OPENAI_API_KEY"},{"provider":"Google","slug":"google","secret_name":"GEMINI_API_KEY"},{"provider":"Mistral","slug":"mistral","secret_name":"MISTRAL_API_KEY"}]}
    env:
      PYTHONUNBUFFERED: "1"
      CONFIRM_ROUND1_CONTINUATION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install exact reviewed runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Verify previous evidence and preserve the charged ledger in a scoped copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/continue_main_round1.py prepare --provider ${{ matrix.provider }} --wave 0 --state results/generation/${{ matrix.slug }}
      - name: Preserve stable continuation marker before any model key is supplied
        uses: actions/upload-artifact@v4
        with:
          name: main-clarified-prompts-20261021-fresh-v1-round1-continuation-prepared-${{ matrix.slug }}
          path: results/generation/${{ matrix.slug }}/wave_manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Generate only this fixed batch with at most two concurrent calls
        env:
          ROUND1_PROVIDER_API_KEY: ${{ secrets[matrix.secret_name] }}
        run: python scripts/continue_main_round1.py generate --provider ${{ matrix.provider }} --wave 0 --state results/generation/${{ matrix.slug }}
      - name: Preserve complete or interrupted generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-main-round1-generation-${{ github.run_id }}-w0-${{ matrix.slug }}-final
          path: results/generation/
          if-no-files-found: error
