name: Full study capped at 35 USD
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: depfailbench-full-study
  cancel-in-progress: false
jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        provider: [OpenAI, Anthropic]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked environment and validate
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pytest -q
      - name: Generate within provider budget
        env:
          OPENAI_API_KEY: ${{ matrix.provider == 'OpenAI' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'Anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          PYTHONUNBUFFERED: '1'
        run: python -m benchmark.full_generate --provider '${{ matrix.provider }}' --cap 17.50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-generated-${{ matrix.provider }}
          path: full_results/
          retention-days: 90
  evaluate:
    needs: generate
    if: always()
    strategy:
      fail-fast: false
      matrix:
        provider: [OpenAI, Anthropic]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: full-generated-${{ matrix.provider }}
          path: full_results
      - name: Evaluate unchanged artifacts three times in separate processes
        run: python -m benchmark.full_batch_eval --repetitions 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-evaluated-${{ matrix.provider }}
          path: full_results/
          retention-days: 90
