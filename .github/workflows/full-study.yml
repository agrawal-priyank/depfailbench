name: Remaining excluded provider validation and saved OpenAI evaluation

on:
  workflow_dispatch:
    inputs:
      gemini_low_feasibility:
        description: Fourteen remaining approved Gemini low-thinking validation responses within $2; no main-study outputs
        required: true
        default: false
        type: boolean
      continue_grok_budget:
        description: Continue only fifteen unfilled Grok validation coordinates after specific budget-amendment approval
        required: true
        default: false
        type: boolean
      evaluate_uniform_saved_sources:
        description: Retest only changed completed Mistral23 and Google3 saved responses under the approved extraction rule; no model calls
        required: true
        default: false
        type: boolean
      resume_grok_request_fix:
        description: Resume only sixteen original unfilled Grok validation slots after reviewed request-format rejection
        required: true
        default: false
        type: boolean
      evaluate_saved_mistral_google:
        description: Evaluate only original Mistral48 and Google16 saved validation responses without model API calls
        required: true
        default: false
        type: boolean
      recover_grok_after_key_fix:
        description: Fill only the sixteen Grok slots proven untouched by run 39486369819 metadata failure
        required: true
        default: false
        type: boolean
      inspect_grok_access_only:
        description: Read-only Grok metadata diagnosis, without generation or saved-code execution
        required: true
        default: false
        type: boolean
      verify_setup_only:
        description: Verify current validation orchestration and immutable-input guards without model credentials or generation
        required: true
        default: false
        type: boolean
      confirm_paid_generation:
        description: Generate only Mistral48/Google16/xAI16 excluded outputs within scoped $1/$3/$8 allowances
        required: true
        default: false
        type: boolean
      evaluate_saved_openai:
        description: Test the 64 saved outputs from run 39474852218 without model calls or model credentials
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: depfailbench-remaining-${{ inputs.gemini_low_feasibility && 'gemini-low-feasibility' || inputs.continue_grok_budget && 'grok-budget-continuation' || inputs.evaluate_uniform_saved_sources && 'uniform-saved-sources' || inputs.resume_grok_request_fix && 'grok-request-correction' || inputs.evaluate_saved_mistral_google && 'saved-mistral-google-evaluation' || inputs.recover_grok_after_key_fix && 'grok-metadata-recovery' || inputs.inspect_grok_access_only && 'grok-metadata-diagnostic' || inputs.verify_setup_only && 'setup-verification' || inputs.confirm_paid_generation && 'provider-generation' || 'saved-openai-evaluation' }}
  cancel-in-progress: false

jobs:
  mistral-validation:
    if: ${{ !inputs.gemini_low_feasibility && !inputs.continue_grok_budget && !inputs.evaluate_uniform_saved_sources && !inputs.resume_grok_request_fix && !inputs.evaluate_saved_mistral_google && !inputs.recover_grok_after_key_fix && !inputs.inspect_grok_access_only && !inputs.verify_setup_only && inputs.confirm_paid_generation && github.run_attempt == '1' && github.ref == 'refs/heads/array-revision-linux-validation' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install exact reviewed dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Verify the exact tested plan without model credentials
        run: python scripts/expanded_remaining_validation.py check-plan --provider Mistral --state results/expanded/mistral_api_validation
      - name: Check the stable prior-batch marker before preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/expanded_remaining_validation.py prior-run-check --provider Mistral --state results/expanded/mistral_prior_guard.json
      - name: Prepare exact excluded allocation and spending ledger
        env:
          CONFIRM_PAID_GENERATION: "true"
        run: python scripts/expanded_remaining_validation.py prepare --provider Mistral --state results/expanded/mistral_api_validation --maximum-cost-usd 1 --guard results/expanded/mistral_prior_guard.json
      - name: Save the stable prepared marker before any provider authentication
        uses: actions/upload-artifact@v4
        with:
          name: mistral-validation-20261020-v1-prepared
          path: results/expanded/mistral_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Verify exact model metadata without generation
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/expanded_remaining_validation.py access --provider Mistral --state results/expanded/mistral_api_validation
      - name: Generate excluded validation group 0
        id: group0
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/expanded_remaining_validation.py group --provider Mistral --state results/expanded/mistral_api_validation --index 0
      - name: Preserve response journals and spending after group 0
        if: ${{ !inputs.evaluate_saved_mistral_google && always() && steps.group0.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: mistral-validation-${{ github.run_id }}-group-0
