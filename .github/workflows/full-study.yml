  mistral-main-saved-evaluation:
    needs: mistral-main-overnight
    if: ${{ inputs.confirm_paid_generation && inputs.verify_setup_only && inputs.continue_grok_budget && !inputs.gemini_low_feasibility && !inputs.evaluate_uniform_saved_sources && !inputs.resume_grok_request_fix && !inputs.evaluate_saved_mistral_google && !inputs.recover_grok_after_key_fix && !inputs.inspect_grok_access_only && !inputs.evaluate_saved_openai && github.run_attempt == '1' && github.ref == 'refs/heads/array-revision-linux-validation' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [E1, E2, E3, E4, E5, E6, E7, E8]
        configuration: [ministral_3b_2512, ministral_14b_2512, ministral_14b_2512_temperature_0p2]
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install same pinned evaluation runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Download same-run Mistral generation archive without executing code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/agrawal-priyank/depfailbench/actions/runs/${{ github.run_id }}/artifacts?per_page=100 > "$RUNNER_TEMP/mistral_artifacts.json"
          python -c 'import json,os; a=json.load(open(os.environ["RUNNER_TEMP"]+"/mistral_artifacts.json")); found=[x for x in a["artifacts"] if x["name"]=="main-mistral-overnight-"+os.environ["GITHUB_RUN_ID"]+"-final"]; assert len(found)==1; open(os.environ["RUNNER_TEMP"]+"/source_artifact_id","w").write(str(found[0]["id"]))'
          source_artifact_id=$(cat "$RUNNER_TEMP/source_artifact_id")
          gh api repos/agrawal-priyank/depfailbench/actions/artifacts/"$source_artifact_id" > "$RUNNER_TEMP/source_metadata.json"
          gh api repos/agrawal-priyank/depfailbench/actions/artifacts/"$source_artifact_id"/zip > "$RUNNER_TEMP/mistral_main.zip"
      - name: Verify every saved source and select exact frozen task configuration cell pair
        run: python scripts/evaluate_main_mistral.py prepare --archive "$RUNNER_TEMP/mistral_main.zip" --metadata "$RUNNER_TEMP/source_metadata.json" --output results/expanded/mistral_main_evaluation --task ${{ matrix.task }} --configuration ${{ matrix.configuration }}
      - name: Evaluate all sixty saved programs at all deadlines and repeats without credentials
        run: python scripts/evaluate_main_mistral.py evaluate --output results/expanded/mistral_main_evaluation
      - name: Preserve complete or interrupted measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-mistral-evaluation-${{ github.run_id }}-${{ matrix.task }}-${{ matrix.configuration }}
          path: |
            results/expanded/mistral_main_evaluation/collection/
            results/expanded/mistral_main_evaluation/verified_inputs.json
            results/expanded/mistral_main_evaluation/evaluation_summary.json
          if-no-files-found: error
          retention-days: 90
