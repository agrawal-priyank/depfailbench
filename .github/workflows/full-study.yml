        run: python -m benchmark.expanded.collection_dry_run --mode synthetic-reporting --bootstraps 200 --output results/expanded/final_synthetic_reporting
      - name: Record exact Linux core and study snapshot with paid execution disabled
        run: |
          python - <<'PYCODE'
          import json, os, sys
          from pathlib import Path
          from benchmark.expanded.collect import environment, implementation_manifest
          from benchmark.expanded.execution_authorization import execution_snapshot
          from benchmark.expanded.planning import assets_root
          study=json.loads((assets_root()/'study.json').read_text())
          assert sys.platform=='linux' and study['frozen'] is False and study['paid_execution_authorized'] is False and study['budget_authorized'] is False
          google=next(c for c in study['configurations'] if c['provider']=='Google')
          assert google['id']=='gemini_3_8_flash_low' and google['generation_settings']['thinking_level']=='low'
          Path('results/expanded/final_protocol_runtime.json').write_text(json.dumps({'environment':environment(),'implementation':implementation_manifest(),'execution_snapshot':execution_snapshot(),'github_commit':os.environ['GITHUB_SHA'],'github_run_id':os.environ['GITHUB_RUN_ID'],'model_api_calls':0,'main_outputs':0,'paid_execution_disabled':True,'verification_scope':'296 current-core tests; 144 mocked provider coordinates; 4320-output synthetic reporting; historical paid-driver plans intentionally not refreshed'},indent=2)+'\n')
          PYCODE
