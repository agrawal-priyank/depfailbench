        run: |
          python -m pytest -q tests/test_expanded_study.py tests/test_expanded_analysis.py tests/test_expanded_providers.py tests/test_expanded_collection.py tests/test_expanded_live_recovery.py tests/test_expanded_reclassification.py tests/test_expanded_status_policy.py tests/test_uniform_source_processing.py tests/test_repeat_audit.py --junitxml=results/expanded/final_protocol_tests.junit.xml
