          retention-days: 90

  grok-medium-sample:
    if: ${{ inputs.grok_medium_sample && !inputs.continue_grok_budget && !inputs.evaluate_uniform_saved_sources && !inputs.resume_grok_request_fix && !inputs.evaluate_saved_mistral_google && !inputs.inspect_grok_access_only && !inputs.verify_setup_only && !inputs.confirm_paid_generation && !inputs.evaluate_saved_openai && !inputs.recover_grok_after_key_fix && github.run_attempt == '1' && github.ref == 'refs/heads/array-revision-linux-validation' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install exact reviewed runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --editable .
      - name: Check the stable one-sample marker without model credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/agrawal-priyank/depfailbench/actions/artifacts?per_page=100&name=grok-medium-sample-20261020-v1-prepared' > "$RUNNER_TEMP/medium_prior.json"
          python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["total_count"]==0 and not r["artifacts"], "Sample already prepared; inspect evidence rather than repeat"' "$RUNNER_TEMP/medium_prior.json"
      - name: Verify isolated medium setup and exact one-response budget before authentication
        run: python scripts/grok_medium_sample.py prepare --state results/expanded/grok_medium_sample
      - name: Preserve stable prepared marker before provider authentication
        uses: actions/upload-artifact@v4
        with:
          name: grok-medium-sample-20261020-v1-prepared
          path: results/expanded/grok_medium_sample/
          if-no-files-found: error
          retention-days: 90
      - name: Generate exactly one medium-effort feasibility response
        env:
          CONFIRM_GROK_MEDIUM_SAMPLE: "true"
          XAI_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python scripts/grok_medium_sample.py generate --state results/expanded/grok_medium_sample
      - name: Preserve complete or interrupted sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grok-medium-sample-${{ github.run_id }}-final
          path: results/expanded/grok_medium_sample/
          if-no-files-found: error
          retention-days: 90

  uniform-saved-source-evaluation:
    if: ${{ !inputs.grok_medium_sample && !inputs.continue_grok_budget && inputs.evaluate_uniform_saved_sources && !inputs.resume_grok_request_fix && !inputs.evaluate_saved_mistral_google && !inputs.inspect_grok_access_only && !inputs.verify_setup_only && !inputs.confirm_paid_generation && !inputs.evaluate_saved_openai && !inputs.recover_grok_after_key_fix && github.run_attempt == '1' && github.ref == 'refs/heads/array-revision-linux-validation' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Mistral
            slug: mistral
            artifact: 12293643835
          - provider: Google
            slug: google
            artifact: 12295806138
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install the same reviewed runtime and analysis dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Verify the uniform processing rule and credential isolation before execution
        run: python -m pytest -q tests/test_uniform_source_processing.py tests/test_saved_remaining_validation.py --junitxml=results/expanded/uniform_source_processing_tests.junit.xml
      - name: Check the stable evaluation marker and download the original archive without source execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/agrawal-priyank/depfailbench/actions/artifacts?per_page=100&name=${{ matrix.slug }}-uniform-source-20261020-v1-verified-inputs' > "$RUNNER_TEMP/prior_uniform_evaluation.json"
          python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["total_count"]==0 and not r["artifacts"], "Previous uniform evaluation exists; recover evidence instead of repeating"' "$RUNNER_TEMP/prior_uniform_evaluation.json"
          gh api repos/agrawal-priyank/depfailbench/actions/artifacts/${{ matrix.artifact }}/zip > "$RUNNER_TEMP/provider_saved_validation.zip"
      - name: Derive every changed completed response using the approved uniform rule
        run: python scripts/evaluate_uniform_source_processing.py prepare --provider ${{ matrix.provider }} --archive "$RUNNER_TEMP/provider_saved_validation.zip" --output results/expanded/${{ matrix.slug }}_uniform_evaluation
      - name: Preserve exact original and derived inputs before executing generated source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-uniform-source-20261020-v1-verified-inputs
          path: results/expanded/${{ matrix.slug }}_uniform_evaluation/
          if-no-files-found: error
          retention-days: 90
      - name: Record the pinned runtime without credentials
        run: |
          python - <<'PYTHON'
          import json,os
          from pathlib import Path
          from benchmark.expanded.collect import environment,implementation_manifest
          Path('results/expanded/${{ matrix.slug }}_uniform_evaluation/runtime.json').write_text(json.dumps({'environment':environment(),'implementation':implementation_manifest(),'github_commit':os.environ['GITHUB_SHA'],'github_run_id':os.environ['GITHUB_RUN_ID'],'model_api_calls':0},indent=2)+'\n')
          PYTHON
      - name: Test only changed completed saved sources at every deadline and prescribed repeat without credentials
        run: python scripts/evaluate_uniform_source_processing.py evaluate --provider ${{ matrix.provider }} --output results/expanded/${{ matrix.slug }}_uniform_evaluation
      - name: Preserve complete or interrupted derived measurements and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-uniform-evaluation-${{ github.run_id }}-final
          path: |
            results/expanded/${{ matrix.slug }}_uniform_evaluation/
            results/expanded/uniform_source_processing_tests.junit.xml
          if-no-files-found: error
          retention-days: 90
