name: Expanded OpenAI excluded validation (paid)

on:
  workflow_dispatch:
    inputs:
      confirm_paid_generation:
        description: Generate exactly 64 excluded OpenAI validation outputs within an $8 operational limit
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: depfailbench-expanded-openai-validation
  cancel-in-progress: false

jobs:
  validation:
    if: ${{ inputs.confirm_paid_generation && github.run_attempt == '1' && github.ref == 'refs/heads/array-revision-linux-validation' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install the exact reviewed dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps --editable .
      - name: Verify batch and billing guards without model credentials
        run: |
          python -m pytest -q tests/test_expanded_openai_batch.py tests/test_expanded_providers.py --junitxml=results/expanded/openai_batch_tests.junit.xml
          python scripts/expanded_openai_validation.py mock-rehearsal --state results/expanded/openai_batch_mock
      - name: Verify this batch has no prior saved dispatch state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/expanded_openai_validation.py prior-run-check --state results/expanded/openai_prior_run_guard.json
      - name: Prepare the exact validation permission and spending ledger
        env:
          CONFIRM_PAID_GENERATION: "true"
        run: python scripts/expanded_openai_validation.py prepare --state results/expanded/openai_api_validation --maximum-cost-usd 8 --guard results/expanded/openai_prior_run_guard.json
      - name: Preserve the stable batch marker before any provider request
        uses: actions/upload-artifact@v4
        with:
          name: openai-validation-20261020-v1-prepared
          path: results/expanded/openai_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Verify access to both selected model identifiers without generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/expanded_openai_validation.py access --state results/expanded/openai_api_validation
      - name: Generate excluded validation pair 0
        id: pair0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/expanded_openai_validation.py pair --state results/expanded/openai_api_validation --index 0
      - name: Preserve response journals and spending after pair 0
        if: ${{ always() && steps.pair0.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: openai-validation-${{ github.run_id }}-pair-0
          path: results/expanded/openai_api_validation/
          if-no-files-found: error
          retention-days: 90
      - name: Generate excluded validation pair 1
        id: pair1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/expanded_openai_validation.py pair --state results/expanded/openai_api_validation --index 1
