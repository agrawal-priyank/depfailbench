name: OpenAI pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depfailbench-openai-pilot
  cancel-in-progress: false

jobs:
  generate-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out the benchmark
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the locked environment
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --editable .

      - name: Confirm the repository baseline
        run: |
          pytest -q
          depfailbench validate-references --repetitions 3

      - name: Confirm the encrypted key is configured
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add the OPENAI_API_KEY repository secret before running this workflow."
            exit 1
          fi

      - name: Generate the eight frozen OpenAI artifacts
        run: |
          depfailbench generate --execute \
            --slot T1_C0_openai_gpt56sol_g1 \
            --slot T1_C0_openai_gpt56sol_g2 \
            --slot T1_C1_openai_gpt56sol_g1 \
            --slot T1_C1_openai_gpt56sol_g2 \
            --slot T4_C0_openai_gpt56sol_g1 \
            --slot T4_C0_openai_gpt56sol_g2 \
            --slot T4_C1_openai_gpt56sol_g1 \
            --slot T4_C1_openai_gpt56sol_g2

      - name: Evaluate the available pilot artifacts
        run: depfailbench pilot --allow-incomplete

      - name: Upload generated artifacts and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depfailbench-openai-pilot-${{ github.run_number }}
          path: |
            artifacts/
            results/
          if-no-files-found: warn
          retention-days: 30

