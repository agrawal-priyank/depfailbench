name: software-offline-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install pinned software and analysis dependencies
        run: |
          python -m pip install -r requirements.lock -r expanded_study/requirements-analysis.txt
          python -m pip install --no-deps .
      - name: Software, handwritten-control and mocked-provider tests
        run: python -m pytest -q tests
      - name: External SDK classifier and saved-summary unit checks only
        run: python -m unittest discover -s external_cases -p 'test_*.py'
      - name: Credential-free structural preflight
        run: python -m benchmark.expanded preflight
