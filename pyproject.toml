[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "depfailbench"
version = "1.0.2"
description = "Deterministic fault-injection benchmark for LLM-generated backend services"
authors = [{ name = "Priyank Agrawal", email = "agrawalpriyank@icloud.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["benchmark", "fault-injection", "llm", "resilience", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/agrawal-priyank/depfailbench"
Documentation = "https://github.com/agrawal-priyank/depfailbench/tree/v1.0.2/docs"
Issues = "https://github.com/agrawal-priyank/depfailbench/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
depfailbench = "benchmark.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchmark*"]

[tool.setuptools.data-files]
"share/depfailbench" = ["ARTIFACT_CONTRACT.md", "generation_plan.json", "protocol.json", "requirements.lock", "full_study_design.json", "full_study_schedule.csv", "README.md", "CITATION.cff", "Licence.txt", "DATA_LICENSE.md", "CHANGELOG.md"]
"share/depfailbench/prompts" = [
  "prompts/shared_rules.md",
  "prompts/T1_C0.md",
  "prompts/T1_C1.md",
  "prompts/T4_C0.md",
  "prompts/T4_C1.md",
]
"share/depfailbench/scaffolds/T1" = ["scaffolds/T1/app.py"]
"share/depfailbench/scaffolds/T4" = ["scaffolds/T4/app.py"]

"share/depfailbench/full_study" = ["full_study/release_manifest.json"]
"share/depfailbench/full_study/prompts" = ["full_study/prompts/*.md"]
"share/depfailbench/full_study/scaffolds/T2" = ["full_study/scaffolds/T2/app.py"]
"share/depfailbench/full_study/scaffolds/T5" = ["full_study/scaffolds/T5/app.py"]
"share/depfailbench/docs" = ["docs/*.md"]
"share/depfailbench/examples" = ["examples/*.py"]
