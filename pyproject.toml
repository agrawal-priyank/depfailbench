[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "depfailbench"
version = "1.2.0"
description = "Deterministic fault-injection benchmark for LLM-generated backend services"
authors = [{ name = "Priyank Agrawal", email = "agrawalpriyank@icloud.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["benchmark", "fault-injection", "llm", "resilience", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/agrawal-priyank/depfailbench"
Documentation = "https://github.com/agrawal-priyank/depfailbench/tree/v1.2.0/docs"
Issues = "https://github.com/agrawal-priyank/depfailbench/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
analysis = ["numpy==2.3.5"]

[project.scripts]
depfailbench = "benchmark.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchmark*"]

[tool.setuptools.data-files]
"share/depfailbench" = ["ARTIFACT_CONTRACT.md", "generation_plan.json", "protocol.json", "requirements.lock", "full_study_design.json", "full_study_schedule.csv", "README.md", "CITATION.cff", "LICENSE", "DATA_LICENSE.md", "CHANGELOG.md", "SCIENTIFIC_SOURCE_MANIFEST.json", "RELEASE_SCOPE.json", "reproduce_saved_analysis.py"]
"share/depfailbench/prompts" = [
  "prompts/shared_rules.md",
  "prompts/T1_C0.md",
  "prompts/T1_C1.md",
  "prompts/T4_C0.md",
  "prompts/T4_C1.md",
]
"share/depfailbench/scaffolds/T1" = ["scaffolds/T1/app.py"]
"share/depfailbench/scaffolds/T4" = ["scaffolds/T4/app.py"]

"share/depfailbench/full_study" = ["full_study/release_manifest.json"]
"share/depfailbench/full_study/prompts" = ["full_study/prompts/*.md"]
"share/depfailbench/full_study/scaffolds/T2" = ["full_study/scaffolds/T2/app.py"]
"share/depfailbench/full_study/scaffolds/T5" = ["full_study/scaffolds/T5/app.py"]
"share/depfailbench/docs" = ["docs/*.md"]
"share/depfailbench/examples" = ["examples/*.py"]
"share/depfailbench/examples/external_task" = ["examples/external_task/*.py", "examples/external_task/*.json"]
"share/depfailbench/examples/external_task/prompts" = ["examples/external_task/prompts/*.md"]
"share/depfailbench/examples/external_task/scaffold" = ["examples/external_task/scaffold/*.py"]
"share/depfailbench/examples/external_task/artifact" = ["examples/external_task/artifact/*.py", "examples/external_task/artifact/*.json"]
"share/depfailbench/external_cases" = ["external_cases/*.py", "external_cases/*.json", "external_cases/*.txt", "external_cases/*.sha256"]
"share/depfailbench/expanded_study" = ["expanded_study/study.json", "expanded_study/scaffold.py", "expanded_study/task_contracts.json", "expanded_study/analysis.py", "expanded_study/requirements-analysis.txt", "expanded_study/provider_fixtures.json", "expanded_study/study_main_frozen_2026-10-20.json", "expanded_study/study_main_frozen_2026-10-21.json", "expanded_study/study_prompt_amendment_2026-10-21.json"]
"share/depfailbench/expanded_study/prompts" = ["expanded_study/prompts/*.md"]
"share/depfailbench/expanded_study/tasks" = ["expanded_study/tasks/*.md"]

"share/depfailbench/research/historical_sensitivity" = ["research/historical_sensitivity/*.py", "research/historical_sensitivity/*.json", "research/historical_sensitivity/*.md"]
